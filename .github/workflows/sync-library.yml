name: Sync Marathon Library

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'
  push:
    paths:
      - '.github/workflows/sync-library.yml'

permissions:
  contents: write

jobs:
  sync-library:
    runs-on: ubuntu-latest
    steps:
      - name: Check out builder
        uses: actions/checkout@v4

      - name: Download current Golden Radio Hour catalog
        run: curl --fail --location --retry 3 --output /tmp/shows.json https://raw.githubusercontent.com/WonderMan33/golden-radio-mp3/main/shows.json

      - name: Build lightweight marathon catalog
        shell: python
        run: |
          import json
          from pathlib import Path

          source = json.loads(Path('/tmp/shows.json').read_text(encoding='utf-8'))
          compact = []

          for track in source:
              show = str(track.get('showTitle') or track.get('show') or '').strip()
              title = str(track.get('displayTitle') or track.get('title') or track.get('episode_title') or '').strip()
              raw_duration = track.get('durationSeconds', track.get('duration_seconds', track.get('duration', 0)))

              try:
                  duration = float(raw_duration or 0)
              except (TypeError, ValueError):
                  duration = 0

              # The master catalog currently leaves many durations null. The
              # listener builder uses 30 minutes as a planning estimate only
              # when an exact duration is unavailable.
              if duration <= 0:
                  duration = 1800

              if not show or not title:
                  continue

              compact.append({
                  'show': show,
                  'episode_title': title,
                  'duration_seconds': duration,
              })

          Path('library.json').write_text(
              json.dumps(compact, ensure_ascii=False, separators=(',', ':')),
              encoding='utf-8'
          )
          print(f'Wrote {len(compact):,} episodes to library.json')

      - name: Point builder at lightweight local catalog
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = 'https://raw.githubusercontent.com/WonderMan33/golden-radio-mp3/main/shows.json'
          if old in text:
              text = text.replace(old, './library.json')
              path.write_text(text, encoding='utf-8')
              print('Updated index.html to use ./library.json')
          elif './library.json' in text:
              print('index.html already uses ./library.json')
          else:
              raise SystemExit('Could not locate expected LIBRARY_URL in index.html')

      - name: Commit repair when changed
        run: |
          if git diff --quiet -- library.json index.html; then
            echo 'Builder and library are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add library.json index.html
          git commit -m 'Sync lightweight marathon library'
          git push
